; This example does nothing until you add an item under [Light Sources].
; Copy the empty_mod folder, rename it for your mod, and replace the example item ID.
; You can keep multiple INIs in your mod's folder; each INI has its own settings.
; Remove the leading semicolon from all three item1 lines to enable the entry.
; Keep the same key in [Light Sources], [Fuel Sources], and [Durations].
; Guide: https://github.com/QTR-Modding/FuelableFramework/wiki

[Light Sources]
; Your wearable lantern, armor, jewelry, or torch.
; item1 = 0x800~MyMod.esp

[Fuel Sources]
; One Dwarven Oil per refill. A COBJ recipe uses its ingredients and quantities.
; Both source sections also accept QTR Utils form group names.
; item1 = 0xF11C0~Skyrim.esm

[Durations]
; Duration per refill, in in-game hours.
; item1 = 8

[Refueling]
; Set false to require manual refilling through SkyPrompt.
AutoRefuel = true

[LoreBox]
; Optional: requires LoreBox and Dynamic Translation Framework.
; Descriptions support keyword-capable items; vanilla torches lack keywords.
Enabled = true
Title = Recharge
Summary = Stored charge: {total_remaining}
Text = {requirements} (+{duration})
TitleColor = A86CCD
TextColor = E8EAED
OptionColor = FFCC80

[SkyPrompt]
; Optional: requires SkyPrompt. Hold the action key to refill.
Enabled = true
Text = Recharge
; Comma-separated hexadecimal keys for reciprocal SkyPrompt handshakes.
CompatibleKeys =
